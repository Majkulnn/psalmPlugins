services:
  php:
    container_name: psalm-plugins
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    working_dir: /app
    volumes:
      - ./:/app
      - psalm_plugins_cache:/var/cache
    environment:
      COMPOSER_CACHE_DIR: /var/cache/composer
      XDG_CACHE_HOME: /var/cache

    stdin_open: true
    tty: true

volumes:
  psalm_plugins_cache: